name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 3. Setup Java JDK 21 (Required for Capacitor Android)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: 4. Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 5. Prepare Capacitor Project and Add Android
        run: |
          mkdir -p www
          cp index.html www/index.html
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.amali.rotation",
            "appName": "عملي",
            "webDir": "www"
          }
          EOF
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap add android
          npx cap sync android

      - name: 6. Build APK via Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 7. Upload Ready-to-Install APK
        uses: actions/upload-artifact@v4
        with:
          name: Amali-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
